version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sitebrain-backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend/chroma_db:/app/chroma_db
      - ./backend/database.db:/app/database.db
      - ./widget:/app/widget
    environment:
      - DATABASE_URL=sqlite:///./database.db
      - GROQ_API_KEY=${GROQ_API_KEY}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sitebrain-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
